[project]
name = "eicvibe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Yue Hao", email = "haoyue@msu.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "h5py>=3.12",
    "numpy>=2",
    "pydantic>=2.12",
    "ruamel-yaml>=0.18",
]

[project.scripts]
eicvibe = "eicvibe.store.cli:main"
eicvibe-web = "eicvibe.api.__main__:main"
eicvibe-virtual = "eicvibe.virtual.__main__:main"
eicvibe-va = "eicvibe.va.__main__:main"
eicvibe-engine = "eicvibe.engines.remote:main"

[project.optional-dependencies]
madx = [
    "cpymad>=1.19",
]
notebook = [
    "anywidget>=0.9",
    "ipykernel>=6.29",
    "jupyterlab>=4.4",
    "matplotlib>=3.10",
    "pandas>=2.2",
]
web = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]
trackpad = [
    "juliacall>=0.9.20",
    "numpy>=2",
]
xsuite = [
    "setuptools>=70",
    "xsuite>=0.63",
    "xtrack>=0.115",
]

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "cpymad>=1.19",
    "eicvibe[web,xsuite,trackpad,notebook]",
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
]

[tool.uv]
# uv's own Pythons, linked to OpenSSL 3: TrackPad's Julia (juliacall) needs Julia's OpenSSL to share
# Python's major version, and Julia has no OpenSSL 4, which Homebrew's Python 3.14 is linked to.
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
